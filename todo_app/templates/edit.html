<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Редактировать задачу</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f0f0f0; margin: 40px; }
        h1 { color: #007BFF; }
        .container { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); max-width: 500px; }
        input[type="text"] { width: 100%; padding: 10px; margin-bottom: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { padding: 10px 20px; background-color: #007BFF; color: white; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background-color: #0056b3; }
        .message { padding: 10px; margin-bottom: 10px; border-radius: 4px; }
        .error { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .info { background-color: #d1ecf1; color: #0c5460; border: 1px solid #bee5eb; }
        a { display: inline-block; margin-top: 10px; color: #555; text-decoration: none; }
        a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Редактирование задачи</h1>
        
        <!-- Блок для вывода сообщений -->
        {% if message %}
            <p class="message {{ msg_type }}">{{ message }}</p>
        {% endif %}

        <form method="POST">
            <input type="text" name="task" value="{{ task.text }}" required autofocus>
            <button type="submit">Сохранить изменения</button>
        </form>
        
        <a href="/">← Вернуться к списку</a>
    </div>
</body>
</html>
